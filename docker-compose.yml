services:

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: medical-triage-api
    ports:
      - "8000:8000"
    restart: unless-stopped
    networks:
      - monitoring


  prometheus:
    image: prom/prometheus:latest
    container_name: medical-triage-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    depends_on:
      - api
    restart: unless-stopped
    networks:
      - monitoring


  grafana:
    image: grafana/grafana:latest
    container_name: medical-triage-grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    restart: unless-stopped
    networks:
      - monitoring


  airflow:
    build:
      context: ./airflow
      dockerfile: Dockerfile
    container_name: medical-triage-airflow
    ports:
      - "8080:8080"
    environment:
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./:/opt/airflow/project
    command: standalone
    restart: unless-stopped
    networks:
      - monitoring


networks:
  monitoring:
    driver: bridge